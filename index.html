<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#040711">
    <title>SANAND TRUCK — Enterprise OS v74.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="https://unpkg.com/html5-qrcode" defer></script>

    <!-- TUTTO IL MOTORE OPERATIVO IN CIMA: NESSUN BLOCCO E APERTURA ISTANTANEA DI TUTTE LE SCHEDE -->
    <script>
        var currentDriver = "";
        var isMaster = false;
        var rows = [];
        var map = null, markers = [], line = null, uPos = {lat: 41.9028, lng: 12.4964};
        var curIdx = null, qr = null, cnv = null, ctx = null, draw = false;

        function el(id) { return document.getElementById(id); }

        function msg(t) {
            var b = el('toast');
            if (b) { b.textContent = t; b.style.display = 'block'; setTimeout(function(){ b.style.display = 'none'; }, 2600); }
        }

        function beep() {
            try {
                var a = new (window.AudioContext || window.webkitAudioContext)();
                var o = a.createOscillator();
                o.frequency.value = 1900; o.connect(a.destination);
                o.start(); o.stop(a.currentTime + 0.07);
            } catch(e){}
        }

        function handleLogin() {
            var sel = el('terminalSelect');
            var key = (el('corpSecretKey').value || "").trim().toLowerCase();
            var pin = (el('loginPin').value || "").trim().toLowerCase();
            var chosen = sel ? sel.value : "";

            if (!chosen) { msg("⚠️ Seleziona l'Unità Operativa!"); return; }
            var okKey = (key === "sanand1234!" || key === "sanand1234" || pin === "sanand1234!");
            var okPin = (pin === "1234" || pin === "0000" || pin === "sanand1234!");

            if (!okKey && !okPin) { msg("❌ Credenziali non valide! Usa SanAnd1234!"); return; }

            currentDriver = chosen;
            isMaster = (chosen.indexOf("TP784-01") !== -1 || chosen.indexOf("TP784-02") !== -1);
            try { localStorage.setItem('san_v74_driver', currentDriver); } catch(e){}

            beep();
            el('loginScreen').style.display = 'none';
            el('appMain').style.display = 'flex';
            el('lblDriver').textContent = currentDriver;
            initApp();
        }

        function logout() {
            try { localStorage.removeItem('san_v74_driver'); } catch(e){}
            location.reload();
        }

        function initApp() {
            try { rows = JSON.parse(localStorage.getItem('san_v74_rows') || "[]"); } catch(e){ rows = []; }
            nextCode();
            refresh();
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(function(p) {
                    uPos = {lat: p.coords.latitude, lng: p.coords.longitude};
                }, function(){}, {enableHighAccuracy: true});
            }
        }

        function openSec(id) {
            if (el('homeGrid')) el('homeGrid').style.display = 'none';
            var secs = document.querySelectorAll('.sec');
            for (var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
            var target = el(id);
            if (target) target.classList.add('active');
            if (id === 'secLoad') nextCode();
            if (id === 'secMap') setTimeout(drawMap, 180);
            window.scrollTo(0, 0);
        }

        function closeSec() {
            if (qr) { try { qr.stop(); } catch(e){} if(el('readerBox')) el('readerBox').style.display = 'none'; }
            var secs = document.querySelectorAll('.sec');
            for (var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
            if (el('homeGrid')) el('homeGrid').style.display = 'grid';
        }

        function nextCode() {
            var c = "SAN-" + String(rows.length + 1).padStart(3, '0') + "-" + Math.floor(1000 + Math.random() * 9000);
            if (el('fCode')) el('fCode').value = c;
            return c;
        }

        function toggleScan() {
            var b = el('readerBox');
            if (b.style.display === 'block') { b.style.display = 'none'; if (qr) qr.stop(); return; }
            if (typeof Html5Qrcode === 'undefined') { nextCode(); msg("⚡ Nuovo Barcode generato"); return; }
            b.style.display = 'block';
            qr = new Html5Qrcode("reader");
            qr.start({facingMode: "environment"}, {fps: 10, qrbox: 220}, function(txt) {
                beep(); el('fCode').value = txt; b.style.display = 'none'; qr.stop(); msg("📷 Letto: " + txt);
            }, function(){}).catch(function(){ b.style.display = 'none'; nextCode(); msg("⚡ Barcode generato"); });
        }

        function fallbackCoords(addr) {
            var h = 0;
            for (var i = 0; i < addr.length; i++) h = addr.charCodeAt(i) + ((h << 5) - h);
            return {lat: 41.895 + ((h % 100) / 2400), lon: 12.495 + (((h >> 4) % 100) / 2400)};
        }

        async function geocode(addr, city) {
            try {
                var r = await fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(addr + ", " + city + ", Italy") + "&limit=1");
                var d = await r.json();
                if (d && d.length) return {lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon)};
            } catch(e){}
            return fallbackCoords(addr);
        }

        async function addStop() {
            var addr = (el('fAddr').value || "").trim();
            if (!addr) { msg("⚠️ Inserisci l'indirizzo e il civico!"); el('fAddr').focus(); return; }
            var code = (el('fCode').value || "").trim() || nextCode();
            var city = (el('fCity').value || "").trim() || "Roma";
            var pt = await geocode(addr, city);

            rows.push({
                code: code, addr: addr, city: city,
                phone: (el('fPhone').value || "").trim(),
                cash: parseFloat(el('fCash').value) || 0,
                note: (el('fNote').value || "").trim(),
                prio: el('fPrio').value,
                otp: Math.floor(1000 + Math.random() * 9000),
                lat: pt.lat, lon: pt.lon, eta: "--:--", km: 0, status: "WAIT", reason: ""
            });

            beep();
            el('fAddr').value = ""; el('fPhone').value = ""; el('fCash').value = ""; el('fNote').value = "";
            nextCode(); refresh();
            msg("✅ Collo #" + rows.length + " in stiva! Pronto per il prossimo.");
        }

        async function importBulk() {
            var raw = (el('txtBulk').value || "").split('\n');
            var count = 0;
            for (var i = 0; i < raw.length; i++) {
                var l = raw[i].trim();
                if (l.length > 3) {
                    var p = l.split(',');
                    var ad = (p[0] || "").trim();
                    var ci = (p[1] || "Roma").trim();
                    var ph = (p[2] || "").trim();
                    var ca = parseFloat(p[3]) || 0;
                    var pt = fallbackCoords(ad);
                    rows.push({
                        code: nextCode(), addr: ad, city: ci, phone: ph, cash: ca,
                        note: "", prio: "STD", otp: Math.floor(1000 + Math.random() * 9000),
                        lat: pt.lat, lon: pt.lon, eta: "--:--", km: 0, status: "WAIT", reason: ""
                    });
                    count++;
                }
            }
            el('modBulk').style.display = 'none'; el('txtBulk').value = "";
            beep(); refresh(); msg("🚀 Importate " + count + " spedizioni!");
        }

        function dist(a1, o1, a2, o2) {
            var R = 6371, dLat = (a2 - a1) * Math.PI / 180, dLon = (o2 - o1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(a1 * Math.PI / 180) * Math.cos(a2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function optimizeGPS() {
            if (!rows.length) { msg("⚠️ Carica prima i colli nel furgone!"); return; }
            var wait = rows.filter(function(r){ return r.status === 'WAIT'; });
            var done = rows.filter(function(r){ return r.status !== 'WAIT'; });
            var sorted = [], cLat = uPos.lat, cLon = uPos.lng, mins = 5, now = new Date();

            while (wait.length > 0) {
                var bIdx = 0, bScore = 999999;
                for (var i = 0; i < wait.length; i++) {
                    var d = dist(cLat, cLon, wait[i].lat, wait[i].lon) * (wait[i].prio === 'EXP' ? 0.35 : 1);
                    if (d < bScore) { bScore = d; bIdx = i; }
                }
                var nxt = wait.splice(bIdx, 1)[0];
                var dKm = dist(cLat, cLon, nxt.lat, nxt.lon);
                nxt.km = dKm.toFixed(1);
                mins += Math.max(4, Math.round((dKm / 25) * 60) + 4);
                nxt.eta = new Date(now.getTime() + mins * 60000).toTimeString().slice(0, 5);
                cLat = nxt.lat; cLon = nxt.lon;
                sorted.push(nxt);
            }
            rows = sorted.concat(done);
